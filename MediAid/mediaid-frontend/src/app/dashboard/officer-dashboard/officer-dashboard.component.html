<div class="dashboard">
  <div class="page-header">
    <div>
      <h1 class="page-title">Officer Dashboard</h1>
    </div>
    <div class="dash-controls">
      @if (lastUpdated) {
        <span class="dash-updated">Updated {{ lastUpdated | date: 'HH:mm:ss' }}</span>
      }
      <button
        class="btn btn-outline"
        type="button"
        (click)="loadAll()"
        [disabled]="loading"
        title="Refresh dashboard"
      >
        {{ loading ? 'Refreshing...' : 'Refresh' }}
      </button>
    </div>
  </div>

  <div class="summary-grid">
    @for (card of summaryCards; track card) {
      <div class="summary-card">
        <div class="card-icon-wrap">{{ card.icon }}</div>
        <div class="card-content">
          <div class="card-value">{{ card.value }}</div>
          <div class="card-label">{{ card.label }}</div>
        </div>
      </div>
    }
  </div>

  <div class="quick-actions-card">
    <h3 class="qa-title">Quick Actions</h3>
    <div class="qa-grid">
      <a routerLink="/officer/citizens" class="qa-item">
        <div class="qa-icon">&#128101;</div>
        <span>Verify Citizens</span>
      </a>
      <a routerLink="/officer/enrollments" class="qa-item">
        <div class="qa-icon">&#9776;</div>
        <span>Review Enrollments</span>
      </a>
      <a routerLink="/officer/claims" class="qa-item">
        <div class="qa-icon">&#9636;</div>
        <span>Process Claims</span>
      </a>
      <a routerLink="/officer/disbursements" class="qa-item">
        <div class="qa-icon">&#8377;</div>
        <span>Disbursements</span>
      </a>
    </div>
  </div>
</div>
