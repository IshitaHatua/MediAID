<div class="dashboard">
  <div class="page-header">
    <div>
      <div class="dash-eyebrow"><span class="eyebrow-dot"></span> Overview</div>
      <h1 class="page-title">Manager Dashboard</h1>
      <p class="page-sub">Monitor schemes, compliance, and formal audits</p>
    </div>
  </div>

  <div class="summary-grid">
    <div class="summary-card" *ngFor="let card of summaryCards">
      <div class="card-icon-wrap">{{ card.icon }}</div>
      <div class="card-content">
        <div class="card-value">{{ card.value }}</div>
        <div class="card-label">{{ card.label }}</div>
      </div>
    </div>
  </div>

  <div class="quick-actions-card">
    <h3 class="qa-title">Quick Actions</h3>
    <div class="qa-grid">
      <a routerLink="/manager/schemes" class="qa-item">
        <div class="qa-icon">&#9873;</div>
        <span>Manage Schemes</span>
      </a>
    </div>
  </div>
</div>
