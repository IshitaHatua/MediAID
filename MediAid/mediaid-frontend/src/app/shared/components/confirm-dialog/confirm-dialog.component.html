<button type="button" class="dialog-close" aria-label="Close" (click)="ref.close(false)">&#10005;</button>
<h2 class="dialog-title">{{ data.title }}</h2>
<div class="dialog-message">{{ data.message }}</div>
<div class="dialog-actions">
  <button type="button" class="btn btn-secondary" (click)="ref.close(false)">Cancel</button>
  <button type="button" class="btn btn-danger" (click)="ref.close(true)">Confirm</button>
</div>
