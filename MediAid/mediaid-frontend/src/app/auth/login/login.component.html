<div class="auth-page">
  <div class="card auth-card">
    <div class="form-header">
      <h1 class="page-title">Sign In</h1>
      <p class="page-sub">Enter your credentials to access the portal</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label>Email Address</label>
        <input class="form-input" formControlName="email" type="email" placeholder="your@email.com">
        <div class="field-error" *ngIf="form.get('email')?.hasError('required')">Email is required</div>
        <div class="field-error" *ngIf="form.get('email')?.hasError('email')">Please enter a valid email</div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label>Password</label>
          <a routerLink="/auth/forgot-password" class="forgot-link">Forgot password?</a>
        </div>
        <div class="password-row">
          <input class="form-input" formControlName="password" [type]="showPw ? 'text' : 'password'" placeholder="Enter your password">
          <button type="button" class="btn btn-secondary btn-sm" (click)="showPw=!showPw">{{ showPw ? 'Hide' : 'Show' }}</button>
        </div>
        <div class="field-error" *ngIf="form.get('password')?.hasError('required')">Password is required</div>
      </div>

      <button type="submit" class="btn btn-primary full-width" [disabled]="loading">
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">Signing in...</span>
      </button>
    </form>

    <p class="switch-link">
      Don't have an account?
      <a routerLink="/auth/register">Create one free</a>
    </p>
  </div>
</div>
