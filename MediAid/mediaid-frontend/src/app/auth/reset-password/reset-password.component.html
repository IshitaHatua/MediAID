<div class="auth-page">
  <div class="card auth-card">
    <div class="form-header">
      <h1 class="page-title">Reset Password</h1>
      <p class="page-sub">Enter the OTP sent to your email</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input class="form-input" formControlName="email" type="email">
        <div class="field-error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">Email is required</div>
      </div>

      <div class="form-group">
        <label>OTP</label>
        <input class="form-input" formControlName="otp" placeholder="Enter OTP">
        <div class="field-error" *ngIf="form.get('otp')?.invalid && form.get('otp')?.touched">OTP is required</div>
      </div>

      <div class="form-group">
        <label>New Password</label>
        <div class="password-row">
          <input class="form-input" formControlName="newPassword" [type]="showPw ? 'text' : 'password'">
          <button type="button" class="btn btn-secondary btn-sm" (click)="showPw=!showPw">{{ showPw ? 'Hide' : 'Show' }}</button>
        </div>
        <div class="field-error" *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched">Minimum 8 characters</div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input class="form-input" formControlName="confirmPassword" type="password">
        <div class="field-error" *ngIf="form.get('confirmPassword')?.hasError('mismatch')">Passwords do not match</div>
      </div>

      <button type="submit" class="btn btn-primary full-width" [disabled]="loading">
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>

    <p class="back-link"><a routerLink="/auth/login">&larr; Back to Login</a></p>
  </div>
</div>
