<div class="auth-page">
  <div class="card auth-card">
    <div class="form-header">
      <h1 class="page-title">Forgot Password</h1>
      <p class="page-sub">Enter your email to receive an OTP</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input class="form-input" formControlName="email" type="email" />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <div class="field-error">Valid email is required</div>
        }
      </div>

      <button type="submit" class="btn btn-primary full-width" [disabled]="loading">
        {{ loading ? 'Sending...' : 'Send OTP' }}
      </button>
    </form>

    <p class="back-link"><a routerLink="/auth/login">&larr; Back to Login</a></p>
  </div>
</div>
