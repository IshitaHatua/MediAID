<div class="auth-page">
  <div class="card auth-card">
    <div class="form-header">
      <h1 class="page-title">Create Account</h1>
      <p class="page-sub">Fill in your details to register as a citizen</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label>Full Name</label>
        <input class="form-input" formControlName="name" placeholder="e.g. Rajesh Kumar">
        <div class="field-error" *ngIf="form.get('name')?.hasError('required')">Full name is required</div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input class="form-input" formControlName="email" type="email" placeholder="your@email.com">
        <div class="field-error" *ngIf="form.get('email')?.hasError('required')">Email is required</div>
        <div class="field-error" *ngIf="form.get('email')?.hasError('email')">Please enter a valid email</div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-row">
          <input class="form-input" formControlName="password" [type]="showPw ? 'text' : 'password'" placeholder="Min. 8 characters">
          <button type="button" class="btn btn-secondary btn-sm" (click)="showPw=!showPw">{{ showPw ? 'Hide' : 'Show' }}</button>
        </div>
        <div class="field-error" *ngIf="form.get('password')?.hasError('required')">Password is required</div>
        <div class="field-error" *ngIf="form.get('password')?.hasError('minlength')">Password must be at least 8 characters</div>
      </div>

      <button type="submit" class="btn btn-primary full-width" [disabled]="loading">
        <span *ngIf="!loading">Create Account</span>
        <span *ngIf="loading">Creating account...</span>
      </button>
    </form>

    <p class="switch-link">
      Already have an account?
      <a routerLink="/auth/login">Sign in</a>
    </p>
  </div>
</div>
