# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/claim_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=hotwheels
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./claim-uploads

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- Circuit Breaker (Resilience4j via OpenFeign) ----
feign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.instances.compliance-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.compliance-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.compliance-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.compliance-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.compliance-service.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.compliance-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.compliance-service.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.timelimiter.instances.compliance-service.timeoutDuration=5s

resilience4j.circuitbreaker.instances.audit-management-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.audit-management-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.audit-management-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.audit-management-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.audit-management-service.waitDurationInOpenState=10s
resilience4j.timelimiter.instances.audit-management-service.timeoutDuration=3s

resilience4j.circuitbreaker.instances.disbursement-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.disbursement-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.disbursement-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.disbursement-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.disbursement-service.waitDurationInOpenState=10s
resilience4j.timelimiter.instances.disbursement-service.timeoutDuration=3s

resilience4j.circuitbreaker.instances.enrollment-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.enrollment-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.enrollment-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.enrollment-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.enrollment-service.waitDurationInOpenState=10s
resilience4j.timelimiter.instances.enrollment-service.timeoutDuration=3s

resilience4j.circuitbreaker.instances.scheme-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.scheme-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.scheme-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.scheme-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.scheme-service.waitDurationInOpenState=10s
resilience4j.timelimiter.instances.scheme-service.timeoutDuration=3s

# claimExternal: composite breaker wrapping createClaim() which spans multiple
# downstream Feign calls (scheme, enrollment, disbursement).
resilience4j.circuitbreaker.instances.claimExternal.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.claimExternal.slidingWindowSize=10
resilience4j.circuitbreaker.instances.claimExternal.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.claimExternal.failureRateThreshold=50
resilience4j.circuitbreaker.instances.claimExternal.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.claimExternal.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.claimExternal.automaticTransitionFromOpenToHalfOpenEnabled=true
# Don't trip the breaker for user-input errors (404 / 400 already converted upstream).
resilience4j.circuitbreaker.instances.claimExternal.ignoreExceptions=\
  com.cts.claim_service.exception.ResourceNotFoundException,\
  com.cts.claim_service.exception.BadRequestException
resilience4j.timelimiter.instances.claimExternal.timeoutDuration=10s

# Logging
logging.level.com.cts.claim_service=INFO
logging.level.org.springframework.security=WARN
