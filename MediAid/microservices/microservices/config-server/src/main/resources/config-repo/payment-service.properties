## ---- Circuit Breaker (Resilience4j via OpenFeign) ----
#feign.circuitbreaker.enabled=true
#
## Used by OpenFeign auto-config (Feign client name = "DISBURSEMENT-SERVICE" -> instance key 'disbursement-service')
#resilience4j.circuitbreaker.instances.disbursement-service.slidingWindowSize=10
#resilience4j.circuitbreaker.instances.disbursement-service.minimumNumberOfCalls=5
#resilience4j.circuitbreaker.instances.disbursement-service.failureRateThreshold=50
#resilience4j.circuitbreaker.instances.disbursement-service.waitDurationInOpenState=10s
#resilience4j.timelimiter.instances.disbursement-service.timeoutDuration=3s
#
## Used by @CircuitBreaker(name = "disbursementService") on PaymentServiceImpl.createPayment.
## Must match the annotation name exactly — camelCase, NOT kebab-case.
#resilience4j.circuitbreaker.instances.disbursementService.slidingWindowSize=10
#resilience4j.circuitbreaker.instances.disbursementService.minimumNumberOfCalls=5
#resilience4j.circuitbreaker.instances.disbursementService.failureRateThreshold=50
#resilience4j.circuitbreaker.instances.disbursementService.waitDurationInOpenState=10s
#resilience4j.circuitbreaker.instances.disbursementService.permittedNumberOfCallsInHalfOpenState=3
#resilience4j.circuitbreaker.instances.disbursementService.automaticTransitionFromOpenToHalfOpenEnabled=true
#resilience4j.circuitbreaker.instances.disbursementService.ignoreExceptions=\
#  com.mediaid.payment.exception.ResourceNotFoundException,\
#  com.mediaid.payment.exception.BadRequestException
#resilience4j.timelimiter.instances.disbursementService.timeoutDuration=10s
