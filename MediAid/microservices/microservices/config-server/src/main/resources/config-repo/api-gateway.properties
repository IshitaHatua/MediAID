# Multipart upload limits (forwarded to citizen-service / claim-service)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Downstream service URLs (local defaults; can be overridden by environment)
service.auth.url=http://localhost:8001
service.user.url=http://localhost:8002
service.citizen.url=http://localhost:8003
service.scheme.url=http://localhost:8004
service.enrollment.url=http://localhost:8005
service.claim.url=http://localhost:8006
service.payment.url=http://localhost:8007
service.disbursement.url=http://localhost:8008
service.compliance.url=http://localhost:8010
service.audit.url=http://localhost:8011
service.audit-management.url=http://localhost:8012

# Logging
logging.level.com.cts.gateway=INFO
logging.level.org.springframework.web=WARN
