# MySQL Datasource (user-service shares the auth_service_db so it can read/manage users)
spring.datasource.url=jdbc:mysql://localhost:3306/auth_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=hotwheels
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- Circuit Breaker (Resilience4j via OpenFeign) ----
feign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.audit-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.audit-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.audit-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.audit-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.audit-service.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.audit-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.audit-service.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.timelimiter.instances.audit-service.timeoutDuration=3s

# Logging
logging.level.com.cts.user=INFO
logging.level.org.springframework.security=WARN
