spring.application.name=claim-service
spring.config.import=optional:configserver:http://localhost:8888

# The properties below are served from the central config-server (GitHub):
# https://github.com/ssrividya26/mediaid-config-repo.git
# Uncomment only if config-server is unavailable and you need local fallback values.

# server.port=8006

# Eureka client
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# eureka.instance.prefer-ip-address=true

# NOTE: spring.cloud.openfeign.circuitbreaker.enabled=true is set in the config-server
# (https://github.com/ssrividya26/mediaid-config-repo/blob/main/claim-service.properties).
# Imported config-server properties take precedence over this local file, so we cannot
# disable that wrapper from here. Instead we register a TimeLimiter for each auto-generated
# Feign-client circuit-breaker name so the 1-second hardcoded fallback in
# Resilience4JCircuitBreakerFactory is never used.
#
# The instance names come from the framework WARN log lines:
#   "No timeLimiterConfig found for <NAME> in time limiter registry, using ... PT1S"
# Pattern: <FeignClientInterfaceName><methodName><ParamType1><ParamType2>...
# These specific keys are NOT defined in the config-server, so local values apply.

resilience4j.timelimiter.instances.SchemeClientgetSchemeByIdLong.timeoutDuration=10s
resilience4j.timelimiter.instances.SchemeClientgetSchemeByIdLong.cancelRunningFuture=false

resilience4j.timelimiter.instances.EnrollmentClientgetEnrollmentStatusLongLong.timeoutDuration=10s
resilience4j.timelimiter.instances.EnrollmentClientgetEnrollmentStatusLongLong.cancelRunningFuture=false

resilience4j.timelimiter.instances.EnrollmentClientgetEnrollmentDetailsLongLong.timeoutDuration=10s
resilience4j.timelimiter.instances.EnrollmentClientgetEnrollmentDetailsLongLong.cancelRunningFuture=false

resilience4j.timelimiter.instances.EnrollmentClientvalidateEnrollmentLongLong.timeoutDuration=10s
resilience4j.timelimiter.instances.EnrollmentClientvalidateEnrollmentLongLong.cancelRunningFuture=false

resilience4j.timelimiter.instances.DisbursementClientgetTotalUtilizedList.timeoutDuration=10s
resilience4j.timelimiter.instances.DisbursementClientgetTotalUtilizedList.cancelRunningFuture=false

resilience4j.timelimiter.instances.AuditManagementFeignClientlogAuditManagementLogRequest.timeoutDuration=10s
resilience4j.timelimiter.instances.AuditManagementFeignClientlogAuditManagementLogRequest.cancelRunningFuture=false

resilience4j.timelimiter.instances.ComplianceFeignClientevaluateLongStringLong.timeoutDuration=10s
resilience4j.timelimiter.instances.ComplianceFeignClientevaluateLongStringLong.cancelRunningFuture=false

# A catch-all default — used by registry consumers that look up "default" by name.
resilience4j.timelimiter.instances.default.timeoutDuration=10s
resilience4j.timelimiter.instances.default.cancelRunningFuture=false
