spring.application.name=scheme-service
# Disable config-server lookup during tests
spring.cloud.config.enabled=false
spring.config.import=

# In-memory H2 for tests
spring.datasource.url=jdbc:h2:mem:scheme_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Eureka client during tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
